<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercices : Genre et Nombre (Noms)</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-dark: #131a26;
            --text-light: #ffffff;
            --text-muted: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            --btn-hover: #1e293b;
            --correct-glow: rgba(34, 197, 94, 0.2);
            --correct-border: #22c55e;
            --wrong-glow: rgba(239, 68, 68, 0.2);
            --wrong-border: #ef4444;
            --border-color: #243242;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        .main-card {
            background-color: var(--card-dark);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* Ligne de dégradé supérieure style "Designer" */
        .main-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--accent-gradient);
        }

        .header-zone {
            text-align: center;
            margin-bottom: 35px;
        }

        .badge-title {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: inline-block;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .progress-bar {
            background-color: #1e293b;
            height: 6px;
            border-radius: 3px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-gradient);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-box {
            margin-bottom: 30px;
        }

        .question-txt {
            font-size: 1.3rem;
            font-weight: 600;
            line-height: 1.4;
        }

        .translate-trigger {
            display: inline-block;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 8px;
            cursor: pointer;
            text-decoration: underline dotted;
            transition: color 0.2s;
        }

        .translate-trigger:hover {
            color: #a855f7;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .opt-btn {
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 18px 24px;
            text-align: left;
            color: var(--text-light);
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .opt-btn:hover:not(:disabled) {
            background-color: var(--btn-hover);
            border-color: #475569;
        }

        .opt-btn.correct {
            border-color: var(--correct-border);
            background-color: var(--correct-glow);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.1);
        }

        .opt-btn.wrong {
            border-color: var(--wrong-border);
            background-color: var(--wrong-glow);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.1);
        }

        .opt-en-txt {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
            margin-top: 4px;
            display: none;
        }

        .feedback-panel {
            margin-top: 25px;
            padding: 20px;
            border-radius: var(--radius);
            font-size: 0.95rem;
            display: none;
            line-height: 1.5;
        }

        .feedback-panel.visible {
            display: block;
        }

        .action-btn {
            width: 100%;
            padding: 16px;
            border-radius: var(--radius);
            border: none;
            background: var(--accent-gradient);
            color: var(--text-light);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 25px;
            transition: opacity 0.2s;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
        }

        .action-btn:hover {
            opacity: 0.9;
        }

        /* Vue Résultats */
        .score-box {
            font-size: 3.5rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 20px 0;
        }

        .comment-box {
            color: var(--text-muted);
            margin-bottom: 25px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="main-card" id="app-card">
        <div class="header-zone">
            <span class="badge-title">Module A1 — Noms uniquement</span>
            <h1>Genre et Nombre</h1>
            <p class="subtitle" id="progress-text">Question 1 sur 10</p>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="bar-fill"></div>
        </div>

        <div class="question-box">
            <div class="question-txt" id="q-text">Chargement de l'exercice...</div>
            <span class="translate-trigger" id="q-tr-trigger" onclick="toggleQTranslation()">Voir la traduction anglaise</span>
        </div>

        <div class="options-list" id="options-block"></div>
        <div class="feedback-panel" id="feedback-block"></div>
        
        <button class="action-btn" id="submit-next-btn" onclick="handleAction()" style="display: none;">Continuer</button>
    </div>
</div>

<script>
    const questionsBank = [
        { question: "Quel est le pluriel correct du nom 'une pomme' ?", questionEn: "What is the correct plural form of the noun 'une pomme' (an apple)?", options: ["des pommes", "des pommex", "des pomme"], optionsEn: ["apples", "incorrect form", "incorrect form"], correct: 0, explain: "Règle générale : on ajoute un -s muet au pluriel." },
        { question: "Sélectionnez le genre correct du nom 'café' :", questionEn: "Select the correct gender for the noun 'café' (coffee):", options: ["Féminin (une café)", "Masculin (un café)"], optionsEn: ["Feminine", "Masculine"], correct: 1, explain: "Le café est un nom masculin." },
        { question: "Quel est le pluriel correct du nom 'un gâteau' ?", questionEn: "What is the correct plural form of the noun 'un gâteau' (a cake)?", options: ["des gâteaus", "des gâteau", "des gâteaux"], optionsEn: ["incorrect", "incorrect", "cakes"], correct: 2, explain: "Les noms se terminant par -eau prennent un -x au pluriel." },
        { question: "Quel est le pluriel du nom 'un animal' ?", questionEn: "What is the plural of the noun 'un animal' (an animal)?", options: ["des animals", "des animaux", "des animauxs"], optionsEn: ["incorrect", "animals", "incorrect"], correct: 1, explain: "Les noms se terminant par -al se transforment en -aux au pluriel." },
        { question: "Le nom 'un prix' se termine par -x. Quel est son pluriel ?", questionEn: "The noun 'un prix' (a price) ends with -x. What is its plural form?", options: ["des prix", "des prixes", "des prixs"], optionsEn: ["prices", "incorrect", "incorrect"], correct: 0, explain: "Les noms terminant par -s, -x, ou -z restent invariables au pluriel." },
        { question: "Si un étudiant est un homme, comment appelle-t-on une femme qui étudie ?", questionEn: "If 'un étudiant' is a male student, what do we call a female student?", options: ["une étudiant", "une étudiante", "une étudianti"], optionsEn: ["incorrect", "female student", "incorrect"], correct: 1, explain: "Pour les êtres vivants de genre féminin, on ajoute un -e à la fin du nom de base." },
        { question: "Quel est le pluriel du nom 'un bus' ?", questionEn: "What is the plural form of the noun 'un bus' (a bus)?", options: ["des buss", "des bus", "des busx"], optionsEn: ["incorrect", "buses", "incorrect"], correct: 1, explain: "Se terminant déjà par un -s, le mot reste invariable." },
        { question: "Quel est le pluriel du nom 'un journal' ?", questionEn: "What is the plural form of the noun 'un journal' (a newspaper)?", options: ["des journals", "des journaux"], optionsEn: ["incorrect", "newspapers"], correct: 1, explain: "Le suffixe -al devient -aux au pluriel." },
        { question: "Quel est le genre correct du mot 'bureau' ?", questionEn: "What is the correct gender of the word 'bureau' (desk/office)?", options: ["Masculin (un bureau)", "Féminin (une bureau)"], optionsEn: ["Masculine", "Feminine"], correct: 0, explain: "Le mot 'bureau' est un nom d'objet masculin." },
        { question: "Quelle est la forme plurielle correcte de 'un nez' ?", questionEn: "What is the correct plural form of 'un nez' (a nose)?", options: ["des nezs", "des nez", "des nezx"], optionsEn: ["incorrect", "noses", "incorrect"], correct: 1, explain: "Les mots finissant par -z ne changent pas au pluriel." },
        { question: "Quelle est la forme féminine du nom 'un chat' ?", questionEn: "What is the feminine form of the noun 'un chat' (a male cat)?", options: ["une chate", "une chatte", "une chattes"], optionsEn: ["incorrect", "female cat", "incorrect"], correct: 1, explain: "Pour le féminin de 'chat', on double la consonne et on ajoute un -e." },
        { question: "Quel est le pluriel du nom 'une eau' ?", questionEn: "What is the plural form of the noun 'une eau' (a water)?", options: ["des eaus", "des eaux", "des eau"], optionsEn: ["incorrect", "waters", "incorrect"], correct: 1, explain: "Les noms terminés par -eau ou -au prennent un -x au pluriel." },
        { question: "Quel est le genre correct du nom 'table' ?", questionEn: "What is the correct gender of the noun 'table' (a table)?", options: ["Masculin (un table)", "Féminin (une table)"], optionsEn: ["Masculine", "Feminine"], correct: 1, explain: "'Table' est un nom d'objet féminin." },
        { question: "Quelle est la forme féminine du nom 'un Français' ?", questionEn: "What is the feminine form of the noun 'un Français' (a Frenchman)?", options: ["une Française", "une Francaise", "une Français"], optionsEn: ["Frenchwoman", "missing accent", "incorrect"], correct: 0, explain: "Le féminin du nom d'habitant 'Français' s'écrit 'Française' (avec un -e et la cédille)." },
        { question: "Quel est le pluriel du nom 'un stylo' ?", questionEn: "What is the plural of the noun 'un stylo' (a pen)?", options: ["des stylox", "des stylos", "des stylo"], optionsEn: ["incorrect", "pens", "incorrect"], correct: 1, explain: "Règle générale : on ajoute un -s pour le pluriel." },
        { question: "Quel est le genre correct du nom 'voiture' ?", questionEn: "What is the correct gender of the noun 'voiture' (a car)?", options: ["Masculin (un voiture)", "Féminin (une voiture)"], optionsEn: ["Masculine", "Feminine"], correct: 1, explain: "'Voiture' est un nom d'objet féminin." },
        { question: "Quel est le pluriel du nom 'un oiseau' ?", questionEn: "What is the plural of the noun 'un oiseau' (a bird)?", options: ["des oiseaus", "des oiseaux"], optionsEn: ["incorrect", "birds"], correct: 1, explain: "Les noms finissant par -eau prennent un -x au pluriel." },
        { question: "Quelle est la forme féminine du nom 'un ami' ?", questionEn: "What is the feminine form of the noun 'un ami' (a male friend)?", options: ["une amis", "une amie", "une ami"], optionsEn: ["incorrect", "female friend", "incorrect"], correct: 1, explain: "On ajoute généralement un -e au singulier pour obtenir le féminin." },
        { question: "Quel est le pluriel du nom 'un pays' ?", questionEn: "What is the plural of the noun 'un pays' (a country)?", options: ["des pays", "des payss", "des payx"], optionsEn: ["countries", "incorrect", "incorrect"], correct: 0, explain: "Comme le mot se termine déjà par un -s, il ne change pas au pluriel." },
        { question: "Quel est le genre correct du nom 'livre' ?", questionEn: "What is the correct gender of the noun 'livre' (a book)?", options: ["Masculin (un livre)", "Féminin (une livre)"], optionsEn: ["Masculine", "Feminine"], correct: 0, explain: "Dans le sens de l'objet de lecture, 'livre' est un nom masculin." }
    ];

    let currentSessionQuestions = [];
    let currentQuestionIdx = 0;
    let score = 0;
    let hasAnswered = false;
    let isTranslationVisible = false;

    function initSession() {
        const shuffled = [...questionsBank].sort(() => 0.5 - Math.random());
        currentSessionQuestions = shuffled.slice(0, 10);
        currentQuestionIdx = 0;
        score = 0;
        loadQuestion();
    }

    function loadQuestion() {
        hasAnswered = false;
        isTranslationVisible = false;
        
        const currentQ = currentSessionQuestions[currentQuestionIdx];
        
        // Updates UI Progress
        document.getElementById('progress-text').innerText = `Question ${currentQuestionIdx + 1} sur 10`;
        const percentage = (currentQuestionIdx / 10) * 100;
        document.getElementById('bar-fill').style.width = percentage + '%';

        // Question block
        document.getElementById('q-text').innerText = currentQ.question;
        document.getElementById('q-tr-trigger').innerText = "Voir la traduction anglaise";
        
        // Clear & Load Options
        const optionsBlock = document.getElementById('options-block');
        optionsBlock.innerHTML = '';
        
        const feedbackBlock = document.getElementById('feedback-block');
        feedbackBlock.className = "feedback-panel";
        feedbackBlock.innerHTML = "";
        
        document.getElementById('submit-next-btn').style.display = "none";

        currentQ.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerHTML = `
                <span>${opt}</span>
                <span class="opt-en-txt" id="en-opt-${idx}">${currentQ.optionsEn[idx]}</span>
            `;
            btn.onclick = () => selectAnswer(idx, btn);
            optionsBlock.appendChild(btn);
        });
    }

    function toggleQTranslation() {
        const currentQ = currentSessionQuestions[currentQuestionIdx];
        const trigger = document.getElementById('q-tr-trigger');
        isTranslationVisible = !isTranslationVisible;
        
        if (isTranslationVisible) {
            document.getElementById('q-text').innerText = `${currentQ.question} (${currentQ.questionEn})`;
            trigger.innerText = "Masquer la traduction";
        } else {
            document.getElementById('q-text').innerText = currentQ.question;
            trigger.innerText = "Voir la traduction anglaise";
        }
    }

    function selectAnswer(selectedIdx, btnElement) {
        if (hasAnswered) return;
        hasAnswered = true;

        const currentQ = currentSessionQuestions[currentQuestionIdx];
        const feedbackBlock = document.getElementById('feedback-block');
        const nextBtn = document.getElementById('submit-next-btn');
        const allButtons = document.querySelectorAll('.opt-btn');

        allButtons.forEach(btn => btn.disabled = true);
        document.querySelectorAll('.opt-en-txt').forEach(el => el.style.display = 'block');

        if (selectedIdx === currentQ.correct) {
            btnElement.classList.add('correct');
            feedbackBlock.style.backgroundColor = "var(--correct-glow)";
            feedbackBlock.style.border = "1px solid var(--correct-border)";
            feedbackBlock.innerHTML = `✨ <strong>Correct !</strong> ${currentQ.explain}`;
            score++;
        } else {
            btnElement.classList.add('wrong');
            allButtons[currentQ.correct].classList.add('correct');
            feedbackBlock.style.backgroundColor = "var(--wrong-glow)";
            feedbackBlock.style.border = "1px solid var(--wrong-border)";
            feedbackBlock.innerHTML = `❌ <strong>Incorrect.</strong> ${currentQ.explain}`;
        }
        
        feedbackBlock.classList.add('visible');
        nextBtn.style.display = "block";
    }

    function handleAction() {
        currentQuestionIdx++;
        if (currentQuestionIdx < 10) {
            loadQuestion();
        } else {
            showFinalResults();
        }
    }

    function showFinalResults() {
        document.getElementById('bar-fill').style.width = '100%';
        document.getElementById('progress-text').innerText = `Session terminée`;
        
        const card = document.getElementById('app-card');
        let commentText = "";
        
        if (score === 10) commentText = "Parfait ! Les bases du genre et du nombre sont solides. 🌟";
        else if (score >= 7) commentText = "Très bien ! Bon niveau d'assimilation des règles. 👍";
        else commentText = "Continuez d'apprendre ! Révisez les règles de pluriels irréguliers (-eau, -al) et repassez le quiz.";

        card.innerHTML = `
            <div class="header-zone">
                <span class="badge-title">Résultats</span>
                <h1>Votre Score</h1>
                <div class="score-box">${score}/10</div>
                <p class="comment-box">${commentText}</p>
                <button class="action-btn" onclick="window.location.reload()">Recommencer un test (Tirage aléatoire)</button>
            </div>
        `;
    }

    // Lance la session au chargement initial
    window.onload = initSession;
</script>

</body>
</html>
